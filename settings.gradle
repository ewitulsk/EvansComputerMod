pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        maven { url = 'https://maven.kikugie.dev/snapshots' }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.1'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

stonecutter {
    create(rootProject) {
        versions '1.21.1', '26.1'
    }
}

rootProject.name = 'evanscomputermod'

// Optional Wasmtime runtime sidecar. Independent NeoForge subproject
// (not stonecutter-aware). Build once per MC version with
// `-PmcVersion=1.21.1` or `-PmcVersion=26.1` (default: 26.1); each
// variant writes to its own build dir. Users drop the matching jar into
// their mods folder alongside the main mod to swap the pure-Java
// Chicory runtime for native-backed wasmtime.
include 'evanscomputermod-wasmtime'
