# The package repository backend (docs/REPO_API.md). Its own workspace: it is
# not a member of rust/Cargo.toml, it only depends on rust/wasm-programs/pkg by path.
[workspace]
members = ["common", "auth-api", "repo-api"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
backend-common = { path = "common" }
ecm_pkg = { package = "pkg", path = "../rust/wasm-programs/pkg" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
tempfile = "3"

# Password hashing is far too slow unoptimised; tests hash many passwords.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
strip = "symbols"
