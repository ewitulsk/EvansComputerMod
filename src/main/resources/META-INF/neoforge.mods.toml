modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/example/evanscomputermod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
A computer terminal mod featuring in-world terminals with WASM execution,
file system access, peripherals and internal expansion modules
(including a Create Redstone Link module when Create is installed).
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

#? if <=1.21.1 {
[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

# Optional: enables the Redstone Link module and interface block.
[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "[6.0.10,)"
ordering = "AFTER"
side = "BOTH"
#?}
