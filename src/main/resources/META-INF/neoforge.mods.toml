modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/example/evanscomputermod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
A computer terminal mod featuring in-world terminals with WASM execution,
file system access, peripherals and internal expansion modules
(including a Create Redstone Link module when Create is installed),
plus lidar sensors wired to a Wired Sensor Module (1.21.1).
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

#? if <=1.21.1 {
[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

# Optional: enables the Redstone Link module and interface block.
[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "[6.0.10,)"
ordering = "AFTER"
side = "BOTH"

# Lidar sensors and sensor wires (wire code ported from PowerGrid, Apache-2.0).
# The #? directives above aren't applied to this file, so 26.1 reads this too:
# its resource overlay has an empty config of the same name.
[[mixins]]
config = "evanscomputermod.sensor.mixins.json"

[[mixins]]
config = "evanscomputermod.testing.mixins.json"

# Tech Villages in superflat worlds (1.21.1; 26.1 has an empty config of the same name).
[[mixins]]
config = "evanscomputermod.worldgen.mixins.json"
#?}
