plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    // CC:Tweaked maven for optional ComputerCraft integration
    maven {
        name = "Squiddev"
        url = 'https://maven.squiddev.cc'
        content {
            includeGroup("cc.tweaked")
            includeModule("org.squiddev", "Cobalt")
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Wasmtime Java bindings for WASM execution
    implementation 'io.github.kawamuray.wasmtime:wasmtime-java:0.19.0'

    // Bundle wasmtime-java into the mod JAR
    jarJar(group: 'io.github.kawamuray.wasmtime', name: 'wasmtime-java', version: '[0.19.0,1.0.0)')

    // FFmpeg Java bindings (bytedeco javacpp-presets) — in-process H.264
    // decoding for the WASI `player` program. `ffmpeg-platform` is a meta
    // artifact that transitively pulls in the real classes jar (`ffmpeg`),
    // the javacpp loader (`javacpp`, `javacpp-platform`), and prebuilt
    // native classifier jars for every supported OS/arch.
    //
    // NeoForge's jarJar bundles only the artifact you name it and does not
    // chase transitive classifier jars, so we flatten everything bytedeco
    // into the final mod jar via the `jar` task below instead.
    implementation 'org.bytedeco:ffmpeg-platform:8.0.1-1.5.13'

    // CC:Tweaked - Optional integration for peripheral support
    // TODO: Re-enable when CC:Tweaked is available for MC 26.1
    // compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core:1.116.2"
    // runtimeOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:1.116.2"

    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Include WASM binaries in JAR resources
tasks.named('processResources') {
    from('wasm-bin') {
        include '*.wasm'
        into 'wasm-bin'
    }
}

// Bundle every bytedeco jar (Java classes + javacpp loader + platform-
// specific native-library classifier jars) directly into the mod jar.
// jarJar doesn't walk transitives or classifiers, so we fat-jar them here.
// This pushes the mod jar size to ~200 MB because it includes prebuilt
// FFmpeg native libraries for linux-x86_64/arm64, macosx-x86_64/arm64,
// windows-x86_64, and android-arm64/x86_64.
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
            'META-INF/MANIFEST.MF', 'module-info.class'
    from({
        configurations.runtimeClasspath
                .findAll { it.name.startsWith('ffmpeg') || it.name.startsWith('javacpp') }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        // Nothing inside these jars needs to sit in a subdirectory — they
        // land at the mod jar root alongside our own classes.
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
