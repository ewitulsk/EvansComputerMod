// Shared per-version build script. Stonecutter's centralScript wiring
// (settings.gradle + stonecutter.gradle.kts) evaluates this once per version
// subproject (:1.21.1, :26.1). The root project has its own controller script
// at stonecutter.gradle.kts and does not evaluate this file.

plugins {
    id 'dev.kikugie.stonecutter'
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

// =====================================================================
// VERSION SUBPROJECT: applied once per stonecutter version.
// =====================================================================
apply plugin: 'java-library'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: 'net.neoforged.moddev'

// Per-MC-version configuration. Indexed by stonecutter.current.version.
def versionProps = [
    '1.21.1': [
        minecraft     : '1.21.1',
        minecraftRange: '[1.21.1,1.22)',
        // Sable 2.0.5 (1.21.1 only) requires NeoForge >= 21.1.228; dev runs and
        // GameTests load it, so build against at least that.
        neo           : '21.1.228',
        neoRange      : '[21.1,)',
        java          : 21,
        // pack_format 48 covers MC 1.21–1.21.1. Earlier values (e.g. 34
        // = 1.20.5/6) cause the data-pack loader to silently skip the
        // new singular registry folders (recipe/, loot_table/) so
        // recipes never register.
        packFormat    : 48,
        // NeoForge 21.1.x ships javafml 4.x; the 26.1 branch moved to javafml 5+.
        loaderRange   : '[4,)',
    ],
    '26.1'  : [
        minecraft     : '26.1',
        minecraftRange: '[26.1,26.2)',
        neo           : '26.1.0.1-beta',
        neoRange      : '[26.1,)',
        java          : 25,
        packFormat    : 101,
        loaderRange   : '[5,)',
    ],
]
def vp = versionProps[stonecutter.current.version]
if (vp == null) {
    throw new GradleException("No versionProps entry for stonecutter version '${stonecutter.current.version}'. Add one to build.gradle.")
}

// ---------------------------------------------------------------------
// Per-version source replacements.
//
// Cheap token-level renames that the MC API went through between 1.21.1
// and 26.1. Applied by stonecutter at preprocess time — source on disk
// stays in 26.1 form; when the active version is 1.21.1, the text is
// rewritten on its way into the generated working copy.
//
// Heavier divergences (BER API rewrite, Screen event signatures, perms)
// use inline `//? if/else` directives in the source itself — see
// ScreenBlockEntityRenderer.java and friends.
// ---------------------------------------------------------------------
if (stonecutter.current.version != '26.1') {
    stonecutter.replacements.string(true) {
        // MC renamed ResourceLocation → Identifier in 26.1. Rewrite back
        // to ResourceLocation for older versions. `Identifier` does not
        // appear as a user type anywhere in this codebase, so a literal
        // token replacement is safe.
        replace 'Identifier', 'ResourceLocation'
        // NeoForge split client-only dispatch into ClientPacketDistributor
        // in 26.1; NeoForge 21.1 keeps everything on PacketDistributor.
        replace 'net.neoforged.neoforge.client.network.ClientPacketDistributor',
                'net.neoforged.neoforge.network.PacketDistributor'
        replace 'ClientPacketDistributor', 'PacketDistributor'
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-mc${vp.minecraft}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(vp.java)

repositories {
    mavenLocal()
    mavenCentral()
}

// Point subproject source sets at stonecutter's per-version generated
// copy of the root src/ tree. Stonecutter reads from the shared root
// `src/main/java` (see the settings.gradle tree root), preprocesses it
// with the active version's directives + replacements, and writes into
// `versions/<ver>/build/generated/stonecutter/<srcset>/…`. We compile
// from that processed output rather than the raw root tree.
def scGenerated = { String subset, String lang ->
    project.file("build/generated/stonecutter/${subset}/${lang}")
}
// Per-MC-version resource overlay. Some data files (notably crafting
// recipes) are version-incompatible at the JSON level: 1.21.1 requires
// object-form ingredient keys (`{"item": "..."}`), while 26.1 only
// accepts the string-form (`"minecraft:..."`). One file can't satisfy
// both, so each version pulls from `src/main/resources-mc<ver>/` for
// its variants. Files here are NOT stonecutter-preprocessed.
def mcOverlay = rootProject.file("src/main/resources-mc${vp.minecraft}")
sourceSets {
    main {
        java { srcDirs = [scGenerated('main', 'java')] }
        resources { srcDirs = [scGenerated('main', 'resources'), rootProject.file('src/generated/resources'), mcOverlay] }
    }
    test {
        java { srcDirs = [scGenerated('test', 'java')] }
        resources { srcDirs = [scGenerated('test', 'resources')] }
    }
}

// Make Java compilation wait for stonecutter to finish preprocessing.
tasks.named('compileJava').configure {
    dependsOn 'stonecutterGenerate'
}
tasks.named('processResources').configure {
    dependsOn 'stonecutterGenerate'
}
if (tasks.findByName('compileTestJava') != null) {
    tasks.named('compileTestJava').configure {
        dependsOn 'stonecutterGenerateTest'
    }
}
if (tasks.findByName('processTestResources') != null) {
    tasks.named('processTestResources').configure {
        dependsOn 'stonecutterGenerateTest'
    }
}

neoForge {
    version = vp.neo

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // ./gradlew :26.1:runGameTestServer -PgameTestNamespaces=ecm_network
        // (use scripts/Test.ps1, which also stages the WASM and checks markers)
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = rootProject.file(providers.gradleProperty('testRunDir').getOrElse('runs/gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces',
                providers.gradleProperty('gameTestNamespaces').getOrElse('ecm_network')
            jvmArgument '-Xmx2G'
            programArgument '--nogui'
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', rootProject.file('src/generated/resources').absolutePath,
                '--existing', rootProject.file('src/main/resources').absolutePath
        }

        if (stonecutter.current.version == '1.21.1') {
            visualServer {
                server()
                gameDirectory = rootProject.file(providers.gradleProperty('visualRunDir').getOrElse('runs/visual') + '/server')
                programArgument '--nogui'
                systemProperty 'ecm.clientChecks', 'true'
                systemProperty 'ecm.clientChecks.suite', providers.gradleProperty('visualSuite').getOrElse('tech')
                // The tech suite needs the headless ISP ring (BGP reroute checks); other suites do not.
                systemProperty 'evanscomputermod.techVillages', providers.gradleProperty('visualSuite').getOrElse('tech') == 'tech' ? 'true' : 'false'
                systemProperty 'evanscomputermod.tap', 'none'
                jvmArgument '-Xmx2G'
            }
            visualClient {
                client()
                gameDirectory = rootProject.file(providers.gradleProperty('visualRunDir').getOrElse('runs/visual') + '/client')
                programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:' + providers.gradleProperty('visualPort').getOrElse('25565'), '--width', '1280', '--height', '720'
                systemProperty 'ecm.clientChecks', 'true'
                systemProperty 'ecm.clientChecks.suite', providers.gradleProperty('visualSuite').getOrElse('tech')
                systemProperty 'ecm.visualOutput', providers.gradleProperty('visualOutput').getOrElse(rootProject.file('artifacts/visual').absolutePath)
                jvmArgument '-Xmx2G'
            }
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // JUnit tests run with Minecraft + NeoForge on the classpath so host
    // classes such as ComputerInstance can be exercised directly
    // (e.g. KernelHostIntegrationTest boots the real kernel).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Chicory: pure-Java WebAssembly runtime. Default provider for the
    // runtime-agnostic SPI in com.example.evanscomputermod.api.wasm.
    // The optional evanscomputermod-wasmtime sidecar registers a higher-
    // priority provider that uses wasmtime-java; see ServiceLoader wiring
    // in src/main/resources/META-INF/services/.
    implementation 'com.dylibso.chicory:runtime:1.7.5'
    implementation 'com.dylibso.chicory:wasm:1.7.5'
    // Compiles wasm functions to JVM bytecode at load time (ChicoryRuntime).
    // Needs ASM, which NeoForge already ships, so ASM itself isn't bundled.
    implementation('com.dylibso.chicory:compiler:1.7.5') {
        exclude group: 'org.ow2.asm'
    }

    // Bundle Chicory into the mod jar (pure Java; no native blobs).
    jarJar(group: 'com.dylibso.chicory', name: 'runtime', version: '[1.7.5,2.0.0)')
    jarJar(group: 'com.dylibso.chicory', name: 'wasm',    version: '[1.7.5,2.0.0)')
    jarJar(group: 'com.dylibso.chicory', name: 'compiler', version: '[1.7.5,2.0.0)') {
        exclude group: 'org.ow2.asm'
    }

    // FFmpeg Java bindings (bytedeco javacpp-presets) — in-process H.264
    // decoding for the WASI `player` program. `ffmpeg-platform` is a meta
    // artifact that transitively pulls in the real classes jar (`ffmpeg`),
    // the javacpp loader (`javacpp`, `javacpp-platform`), and prebuilt
    // native classifier jars for every supported OS/arch.
    //
    // NeoForge's jarJar bundles only the artifact you name it and does not
    // chase transitive classifier jars, so we flatten everything bytedeco
    // into the final mod jar via the `jar` task below instead.
    implementation 'org.bytedeco:ffmpeg-platform:8.0.1-1.5.13'

    // Sable physics engine and Create - 1.21.1 only, both optional at runtime.
    // Neither is on a public maven we use; scripts/fetch-libs.sh downloads
    // them into libs/ and extracts their jar-in-jar libraries (Ponder's
    // catnip, Flywheel, Sable's companion math) into libs/compile/ for javac.
    // All Sable- and Create-touching code is stonecutter-guarded so 26.1
    // compiles without them, and Create code is only classloaded when
    // ModList reports "create" (see compat/create/).
    if (stonecutter.current.version == '1.21.1') {
        def libs = rootProject.file('libs')
        // Checked when compiling, not at configuration: a 26.1-only run
        // (e.g. CI's :26.1:test) also configures this project.
        tasks.named('compileJava').configure {
            doFirst {
                ['sable-neoforge-1.21.1-2.0.5.jar', 'create-1.21.1-6.0.10.jar'].each { name ->
                    if (!new File(libs, name).exists()) {
                        throw new GradleException("libs/${name} is missing. Run: bash scripts/fetch-libs.sh")
                    }
                }
            }
        }
        compileOnly files("${libs}/sable-neoforge-1.21.1-2.0.5.jar", "${libs}/create-1.21.1-6.0.10.jar")
        compileOnly fileTree(dir: "${libs}/compile", include: ['*.jar'])
        // FML 4 (NeoForge 21.1) doesn't put plain `implementation` libraries on the
        // game's classpath in dev runs (runClient/runServer/runGameTestServer), so
        // Chicory and FFmpeg were missing there. The release jar bundles them anyway.
        additionalRuntimeClasspath 'com.dylibso.chicory:runtime:1.7.5'
        additionalRuntimeClasspath 'com.dylibso.chicory:wasm:1.7.5'
        additionalRuntimeClasspath('com.dylibso.chicory:compiler:1.7.5') {
            exclude group: 'org.ow2.asm'
        }
        additionalRuntimeClasspath 'org.bytedeco:ffmpeg-platform:8.0.1-1.5.13'
    }

    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Chicory compiles python.wasm (~13 MB) in-process for the kernel host tests;
    // Gradle's 512 MB default test heap runs out.
    maxHeapSize = '3g'
    // JUnit runs with the mod loaded (neoForge.unitTest). On 1.21.1 the mod
    // can't load there because Sable is compileOnly, so tests run on 26.1
    // only (see TESTING.md). Without this, `build`/chiseledBuild fail.
    enabled = stonecutter.current.version != '1.21.1'
}

// Include WASM binaries in JAR resources. Source is the root-level wasm-bin/
// directory populated by copy-jar.sh / scripts/build-wasm-programs.sh.
tasks.named('processResources') {
    from(rootProject.file('wasm-bin')) {
        include '*.wasm'
        into 'wasm-bin'
    }
}

// Bundle every bytedeco jar (Java classes + javacpp loader + platform-
// specific native-library classifier jars) directly into the mod jar.
// jarJar doesn't walk transitives or classifiers, so we fat-jar them here.
// This pushes the mod jar size to ~200 MB because it includes prebuilt
// FFmpeg native libraries for linux-x86_64/arm64, macosx-x86_64/arm64,
// windows-x86_64, and android-arm64/x86_64.
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
            'META-INF/MANIFEST.MF', 'module-info.class'
    from({
        configurations.runtimeClasspath
                .findAll { it.name.startsWith('ffmpeg') || it.name.startsWith('javacpp') }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        // Nothing inside these jars needs to sit in a subdirectory — they
        // land at the mod jar root alongside our own classes.
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : vp.minecraft,
            minecraft_version_range: vp.minecraftRange,
            neo_version            : vp.neo,
            neo_version_range      : vp.neoRange,
            loader_version_range   : vp.loaderRange,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            pack_format            : vp.packFormat,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Keep parameter names: peripheral methods (api/peripheral) report and
    // document their arguments by name.
    options.compilerArgs << '-parameters'
}
