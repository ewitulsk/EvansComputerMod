# Gradle Settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false

# Acknowledge stonecutter's Groovy-DSL warning (we have an existing Groovy
# build and don't want to rewrite it in Kotlin DSL just for this plugin).
dev.kikugie.stonecutter.hard_mode=true

# Mod Properties (shared across all MC versions)
mod_id=evanscomputermod
mod_name=EvansComputerMod
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.example.evanscomputermod
mod_authors=Example

# Per-MC-version values (Minecraft version, NeoForge version, Java toolchain,
# resource-pack format, NeoForge loader version range) live in
# build.gradle's versionProps map, keyed by stonecutter.current.version.
