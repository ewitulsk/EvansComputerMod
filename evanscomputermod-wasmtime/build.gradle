// Wasmtime sidecar mod. Pure NeoForge subproject (no Stonecutter for now)
// targeting MC 26.1. Ships an additional WasmRuntimeProvider implementation
// backed by wasmtime-java, which the main mod picks up via ServiceLoader
// when the sidecar jar is present in the mods folder.
//
// This is the only place in the codebase that bundles native binaries.
// The main mod is pure-Java; install this sidecar only if you trust the
// source.
//
// Note: 1.21.1 support is a follow-up; the 1.21.1 path of the main mod
// requires the optional Sable physics jar in libs/, which gates compile
// for downstream subprojects too. 26.1 has no such gate.

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

version = rootProject.findProperty('mod_version') ?: '1.0.0'
group = 'com.example.evanscomputermod.wasmtime'

base {
    archivesName = 'evanscomputermod-wasmtime-mc26.1'
}

repositories {
    mavenLocal()
    mavenCentral()
}

neoForge {
    version = '26.1.0.1-beta'

    mods {
        'evanscomputermod_wasmtime' {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Compile against the main mod's classes for the SPI surface
    // (com.example.evanscomputermod.api.wasm.*). The sidecar runs
    // alongside the main mod at runtime; the user installs both jars.
    compileOnly project(path: ':26.1')

    // Wasmtime native bindings + JarJar for distribution.
    implementation 'io.github.kawamuray.wasmtime:wasmtime-java:0.19.0'
    jarJar(group: 'io.github.kawamuray.wasmtime', name: 'wasmtime-java', version: '[0.19.0,1.0.0)')
}
