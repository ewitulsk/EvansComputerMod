// File upload sidecar mod. Pure NeoForge subproject (no Stonecutter), built
// like the wasmtime and FFmpeg sidecars: MC 26.1 by default, -PmcVersion=1.21.1
// for the 1.21.1 variant, each variant in its own build dir.
//
// Lets a player copy a file from their real computer into a computer in the
// game (the `upload` command, Files' Upload button). Needed on both sides: the
// file picker runs in the player's game (LWJGL's tinyfiledialogs, which
// Minecraft already ships for Windows, Linux and macOS) and the bytes go to the
// server over the network. Without it on either side, upload isn't offered.
//
// The few calls whose names differ between the two Minecraft versions live in
// src/mc<version>/java (class Compat).

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

def mcVersion = (project.findProperty('mcVersion') ?: '26.1').toString()
def variants = [
    '1.21.1': [
        neo          : '21.1.228',
        neoRange     : '[21.1,)',
        minecraftRange: '[1.21.1,1.22)',
        loaderRange  : '[4,)',
        java         : 21,
        mainModDep   : ':1.21.1',
    ],
    '26.1'  : [
        neo          : '26.1.0.1-beta',
        neoRange     : '[26.1,)',
        minecraftRange: '[26.1,26.2)',
        loaderRange  : '[5,)',
        java         : 25,
        mainModDep   : ':26.1',
    ],
]
def cfg = variants[mcVersion]
if (cfg == null) {
    throw new GradleException("Unsupported -PmcVersion=${mcVersion}. Expected one of: ${variants.keySet()}")
}

layout.buildDirectory = layout.projectDirectory.dir("build-mc${mcVersion}")

java.toolchain.languageVersion = JavaLanguageVersion.of(cfg.java)

version = rootProject.findProperty('mod_version') ?: '1.0.0'
group = 'com.example.evanscomputermod.upload'

base {
    archivesName = "evanscomputermod-upload-mc${mcVersion}"
}

sourceSets {
    main {
        java {
            srcDir "src/mc${mcVersion}/java"
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

neoForge {
    version = cfg.neo

    mods {
        'evanscomputermod_upload' {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // The SPI (com.example.evanscomputermod.api.upload.*) comes from the main mod,
    // which the user installs next to this one.
    compileOnly project(path: cfg.mainModDep)
}

processResources {
    inputs.property 'mcVersion', mcVersion
    def tokens = [
        neo_version_range      : cfg.neoRange,
        minecraft_version_range: cfg.minecraftRange,
        loader_version_range   : cfg.loaderRange,
    ]
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(tokens)
    }
}
