name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle wrapper
        run: |
          chmod +x scripts/setup-gradle-wrapper.sh
          ./scripts/setup-gradle-wrapper.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle wrapper
        run: |
          chmod +x scripts/setup-gradle-wrapper.sh
          ./scripts/setup-gradle-wrapper.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Get mod version
        id: get_version
        run: |
          VERSION=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Mod version: $VERSION"

      - name: Generate release tag
        id: release_tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}-$(date +'%Y%m%d%H%M%S')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Custom World Mod ${{ steps.get_version.outputs.version }}"
          body: |
            ## Custom World Generation Mod
            
            **Minecraft Version:** 1.21.1  
            **NeoForge Version:** 21.1.77+
            
            ### Features
            - Custom dimension with unique checkerboard pillar world generation
            - Floating islands with grass and dirt
            - Lava seas between pillars
            - Glowstone and glass pillars with sea lantern tops
            - `/tpcustomworld` command to teleport to the custom dimension
            - `/tpoverworld` command to return to the overworld
            
            ### Installation
            1. Download the JAR file
            2. Place it in your `mods` folder
            3. Run Minecraft with NeoForge 1.21.1
            
            ### Usage
            Use `/tpcustomworld` in-game to teleport to the custom dimension!
          files: build/libs/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
