name: Backend

# Tests the package repository backend, builds its image, pushes it to GHCR
# and (on main, or by hand) deploys it to the droplet. docs/DEPLOY.md, step 12,
# lists the "production" environment and the secrets this needs.

on:
  push:
    branches: [main, staging]
    paths:
      - "backend/**"
      - "rust/wasm-programs/pkg/**"
      - "infra/docker/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy: a commit SHA or a branch name that was already built (also how to roll back)"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: cargo test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Tests
        run: cargo test --locked

  image:
    name: Build and push the image
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (ghcr.io/<owner in lower case>/ecm-repo-backend)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecm-repo-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The context is the repository root: backend/ depends on
      # rust/wasm-programs/pkg by path. The root .dockerignore keeps it small.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the droplet
    # Only a manual run, or a push to main whose image was built. Never staging.
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image.result == 'success')
      ) }}
    needs: image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: backend-deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_DIR: /opt/ecm-repo
      INPUT_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose the image tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_SHA"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::not a valid image tag"
            exit 1
          fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set in the production environment"
              exit 1
            fi
          done
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host droplet"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 15"
          } > ~/.ssh/config

      - name: Copy infra/docker to the droplet
        run: |
          set -euo pipefail
          cd infra/docker
          scp -p docker-compose.yml Caddyfile litestream.yml .env.example deploy.sh backup-check.sh "droplet:$DEPLOY_DIR/"

      # Optional: keep the whole .env in the DEPLOY_ENV_FILE secret and let
      # every deploy write it. Without that secret the .env already on the
      # droplet is used.
      - name: Write .env (only when DEPLOY_ENV_FILE is set)
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_ENV_FILE" ]; then
            echo "DEPLOY_ENV_FILE is not set: using the .env on the droplet."
            exit 0
          fi
          # shellcheck disable=SC2029  # DEPLOY_DIR is meant to expand here
          printf '%s\n' "$DEPLOY_ENV_FILE" |
            ssh droplet "umask 077 && cat > '$DEPLOY_DIR/.env.new' && mv '$DEPLOY_DIR/.env.new' '$DEPLOY_DIR/.env'"

      # The read-only registry token goes over SSH on stdin, never on a
      # command line. Skipped when the image is public and no token is set.
      - name: Log the droplet in to GHCR
        env:
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GHCR_READ_TOKEN" ] || [ -z "$GHCR_READ_USER" ]; then
            echo "GHCR_READ_USER/GHCR_READ_TOKEN are not set: not logging in."
            exit 0
          fi
          if ! printf '%s' "$GHCR_READ_USER" | grep -Eq '^[A-Za-z0-9-]{1,39}$'; then
            echo "::error::GHCR_READ_USER is not a GitHub user name"
            exit 1
          fi
          # shellcheck disable=SC2029  # the checked user name is meant to expand here
          printf '%s' "$GHCR_READ_TOKEN" |
            ssh droplet "docker login ghcr.io --username '$GHCR_READ_USER' --password-stdin" > /dev/null

      - name: Deploy
        run: |
          # shellcheck disable=SC2029  # both values are meant to expand here
          ssh droplet "cd '$DEPLOY_DIR' && ./deploy.sh '$IMAGE_TAG'"

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
