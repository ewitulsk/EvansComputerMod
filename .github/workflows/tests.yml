name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  rust:
    name: Rust crates, kernel ABI, simulator scenarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install wasi-sdk (the C sources of lua and of the browser's QuickJS)
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-30.0-x86_64-linux" >> "$GITHUB_ENV"
          echo "AR_wasm32_wasip1=$RUNNER_TEMP/wasi-sdk-30.0-x86_64-linux/bin/llvm-ar" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Unit and integration tests (stack, bridge, router, BGP, kernel)
        run: cargo test -p ecm-net -p ecm-bridge -p ecm-router -p ecm-bgp -p terminal-os

      - name: Device drivers and the GBA emulator
        run: cargo test --release -p ecm-host-abi -p ecm-audio -p gba -p rustboyadvance-core

      - name: Build kernel and programs
        run: |
          cargo build --release --target wasm32-unknown-unknown -p terminal-os
          cargo build --release --target wasm32-wasip1 --workspace --exclude terminal-os --exclude terminal-simulator --exclude ecm-net --exclude ecm-bridge --exclude ecm-host-abi || true

      # The Tech Village repository: the Discord and Music packages, built the way
      # scripts/stage-wasm.sh does (VillageRepoTest and the jar read it from wasm-bin/repo/).
      - name: Tech Village app repository
        run: cargo run --quiet -p discord --example village_repo -- target/wasm32-wasip1/release/discord.wasm ../wasm-bin/repo --music=target/wasm32-wasip1/release/music.wasm

      - name: Kernel ABI matches abi/host-abi.toml
        working-directory: .
        run: python3 scripts/check-abi.py

      - name: Simulator scenarios
        run: cargo test -p terminal-simulator --release

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            rust/target/wasm32-unknown-unknown/release/terminal_os.wasm
            rust/target/wasm32-wasip1/release/*.wasm
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: village-repo
          path: wasm-bin/repo
          retention-days: 7

  java:
    name: Java host against the real kernel
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      # Paths are relative to rust/target (the artifact's common root), so
      # this restores target/wasm32-*/release/*.wasm.
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: rust/target

      - uses: actions/download-artifact@v4
        with:
          name: village-repo
          path: wasm-bin/repo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle wrapper
        run: |
          chmod +x scripts/setup-gradle-wrapper.sh
          ./scripts/setup-gradle-wrapper.sh
          chmod +x gradlew

      # 26.1 has no compile-only Sable dependency, so its test classpath can
      # load the mod; KernelHostIntegrationTest runs the kernel in ComputerInstance.
      - name: JUnit (MC 26.1)
        run: ./gradlew :26.1:test --console=plain

      - name: Native Wasmtime cancellation isolation
        run: ./gradlew :evanscomputermod-wasmtime:test --tests '*.InterruptIsolationTest' --console=plain
