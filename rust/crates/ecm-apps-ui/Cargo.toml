[package]
name = "ecm-apps-ui"
version = "0.1.0"
edition = "2021"
description = "The app platform's user-facing parts (docs/gui/APPS.md): the App Store, the file picker, the open-with chooser and the Settings -> Apps pane, as ecm-ui code that runs on the host in tests and as the store / picker / chooser programs."

[lib]
name = "ecm_apps_ui"
doctest = false

[dependencies]
ecm-ui = { workspace = true }
ecm-ui-proto = { workspace = true }
ecm-host-abi = { workspace = true }
pkg = { path = "../../wasm-programs/pkg" }
miniz_oxide = "0.8"
serde_json = "1"
# The shared sign-in screen (signin.rs): pins, fingerprints, refusals.
ecm-auth = { workspace = true }

[dev-dependencies]
ecm-disco = { workspace = true }
