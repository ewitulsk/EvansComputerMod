[package]
name = "ecm-discord"
version = "0.1.0"
edition = "2021"
description = "Discord for the mod's computers: the DISCORD/1 line protocol, the backend (discordd) as a state machine with servers, text and voice channels, members and saved state, and the UDP voice packets (the voice gate, jitter mixer and echo guard come from ecm-rtp). Pure Rust (no host calls) so it is tested on the host."

[lib]
name = "ecm_discord"
doctest = false

[dependencies]
ecm-chat = { workspace = true }
ecm-audio = { workspace = true }
ecm-auth = { workspace = true }
ecm-rtp = { workspace = true }
