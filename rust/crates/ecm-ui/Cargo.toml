[package]
name = "ecm-ui"
version = "0.1.0"
edition = "2021"
description = "The ECM GUI toolkit (docs/gui/UI_PROTOCOL.md §13): retained widgets, layout with size classes, theme as data, text wrapping with the ECM font metrics, hit routing, focus, and a diff engine that turns widget changes into minimal TreeOps. Runs against ecm-host-abi::ui on wasm32 or a mock connection in tests."

[lib]
name = "ecm_ui"

[dependencies]
ecm-ui-proto = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ecm-host-abi = { workspace = true }
