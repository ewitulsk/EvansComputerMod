[workspace]
members = [
    "operating-system/rust",
    "simulator",
    "crates/ecm-host-abi",
    "crates/ecm-ssh-protocol",
    "crates/ecm-ssh-crypto",
    "crates/ecm-net",
    "crates/ecm-bridge",
    "crates/ecm-audio",
    "crates/ecm-router",
    "crates/ecm-bgp",
    "crates/ecm-wifi",
    "crates/ecm-dsp",
    "wasm-programs/sshd",
    "wasm-programs/ssh-client",
    "wasm-programs/cat",
    "wasm-programs/grep",
    "wasm-programs/hello",
    "wasm-programs/peripherals",
    "wasm-programs/uppercase",
    "wasm-programs/wc",
    "wasm-programs/echo",
    "wasm-programs/ls",
    "wasm-programs/help",
    "wasm-programs/clear",
    "wasm-programs/pwd",
    "wasm-programs/mkdir",
    "wasm-programs/rm",
    "wasm-programs/cp",
    "wasm-programs/mv",
    "wasm-programs/touch",
    "wasm-programs/sleep",
    "wasm-programs/nslookup",
    "wasm-programs/ping",
    "wasm-programs/traceroute",
    "wasm-programs/ifconfig",
    "wasm-programs/ip",
    "wasm-programs/resolvectl",
    "wasm-programs/passwd",
    "wasm-programs/curl",
    "wasm-programs/httpd",
    "wasm-programs/ssh-keygen",
    "wasm-programs/edit",
    "wasm-programs/git",
    "wasm-programs/fd_test",
    "wasm-programs/tty_test",
    "wasm-programs/crypto_test",
    "wasm-programs/python",
    "wasm-programs/tcpdump",
    "wasm-programs/player",
    "wasm-programs/mousetest",
    "wasm-programs/controllertest",
    "wasm-programs/beep",
    "wasm-programs/aplay",
    "wasm-programs/gba",
]
resolver = "2"

[workspace.dependencies]
ecm-host-abi = { path = "crates/ecm-host-abi" }
ecm-ssh-protocol = { path = "crates/ecm-ssh-protocol" }
ecm-ssh-crypto = { path = "crates/ecm-ssh-crypto" }
ecm-net = { path = "crates/ecm-net" }
ecm-bridge = { path = "crates/ecm-bridge" }
ecm-audio = { path = "crates/ecm-audio" }
ecm-router = { path = "crates/ecm-router" }
ecm-bgp = { path = "crates/ecm-bgp" }
ecm-dsp = { path = "crates/ecm-dsp" }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "rand_core"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
rand_core = { version = "0.6", default-features = false }
getrandom = { version = "0.2", features = ["custom"] }

[patch.crates-io]
# Patch RustPython to fix CLOCK_PROCESS_CPUTIME_ID not available on wasm32-wasip1
rustpython-vm = { path = "crates/rustpython-vm-patch" }

# ecm-bridge: optimise its dev/test builds (keeps the netsim/fuzz tests fast)
# and stop it from reusing generic instances shared by upstream crates in
# debug builds (legacy ecm-net objects reference host-only extern imports,
# which do not link into native test binaries).
[profile.dev.package.ecm-bridge]
opt-level = 2

# ecm-dsp: modem round-trip tests push millions of samples; keep them fast.
[profile.dev.package.ecm-dsp]
opt-level = 2

# Native kernel tests must discard unused WASM-only ABI wrappers before MSVC
# links the shared codegen object (including the peripheral host imports).
[profile.dev.package.ecm-host-abi]
opt-level = 2

# The kernel is loaded into every computer: optimise it for size. (This used
# to sit in the kernel's own Cargo.toml, where Cargo silently ignores it.)
[profile.release.package.terminal-os]
opt-level = "s"
