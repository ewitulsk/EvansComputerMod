[target.wasm32-unknown-unknown]
# - Custom getrandom backend (needed by the kernel and its transitive deps).
# - --initial-memory=4194304 grows the kernel's initial linear memory to
#   64 pages (4 MiB). The default ~19 pages only leaves ~640 KiB between
#   SCREEN_GFX_BASE and the shadow stack floor, which isn't enough for a
#   full-color (RGBA8888) screen framebuffer at 640×360 (~900 KiB + header).
#   With 64 pages and SCREEN_GFX_BASE relocated to 0x300000, the screen
#   region has a 1 MiB carve-out past the heap.
rustflags = [
    "--cfg", "getrandom_backend=\"custom\"",
    "-C", "link-arg=--initial-memory=4194304",
]

[target.wasm32-wasip1]
# Enable custom getrandom backend for WASI programs that need it
rustflags = ["--cfg", "getrandom_backend=\"custom\""]
