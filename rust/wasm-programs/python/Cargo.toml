[package]
name = "python"
version = "0.1.0"
edition = "2021"

# The `_radio` native module lives in the library so it can be tested on the
# host with a real interpreter (`cargo test -p python`); the binary links the
# host ABI and only builds for wasm32-wasip1.
[lib]
name = "ecm_python"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "python"
path = "src/main.rs"
test = false

[dependencies]
ecm-host-abi = { workspace = true }
ecm-radio = { workspace = true }
ecm-dsp = { workspace = true }
num-complex = { version = "0.4", default-features = false, features = ["std"] }

# RustPython for embedded Python interpreter
rustpython-vm = { version = "0.3", default-features = false, features = ["freeze-stdlib", "compiler"] }

# Provide custom random for WASM
getrandom = { version = "0.2", features = ["custom"] }

# Override chrono to disable wasmbind feature (avoids js-sys imports)
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
