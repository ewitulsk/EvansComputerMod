doctest = false

[[bin]]
name = "httpd"
path = "src/main.rs"
test = false

[dependencies]
ecm-host-abi = { workspace = true }

[target.'cfg(target_os = "wasi")'.dependencies]
ecm-http = { workspace = true }
ecm-tls = { workspace = true }
