[package]
name = "mrfd"
version = "0.1.0"
edition = "2021"
description = "mrfd: the carrier's media server (voicemail with visual voicemail over HTTP, intercept announcements, the 611 support line, three-way call mixing). The machine is ecm_tel::mrf; this is the computer's loop."

[[bin]]
name = "mrfd"
path = "src/main.rs"
test = false

[dependencies]
ecm-tel = { workspace = true }

[target.'cfg(target_os = "wasi")'.dependencies]
ecm-tel-net = { workspace = true }
ecm-cell-net = { path = "../../crates/ecm-cell-net" }
ecm-host-abi = { workspace = true }
