[package]
name = "terminal-os"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Provide custom random for WASM
getrandom = { version = "0.2", features = ["custom"] }

# Override chrono to disable wasmbind feature (avoids js-sys imports) — used by git.rs
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Git implementation - SHA-1 hashing and zlib compression (both pure Rust, WASM-compatible)
sha1 = { version = "0.10", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Shared networking stack
ecm-net = { workspace = true }

# Host ABI (for shared netlink constants/structs)
ecm-host-abi = { workspace = true }

# SSH crypto
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "rand_core"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
rand_core = { version = "0.6", default-features = false }

[profile.release]
opt-level = "s"  # Optimize for size
lto = true

[features]
default = []
