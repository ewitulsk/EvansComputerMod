[package]
name = "terminal-os"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# getrandom 0.2 with a custom backend routed to the host (see hal.rs).
getrandom = { version = "0.2", features = ["custom"] }

# Sans-IO host network stack and L2 bridge.
ecm-net = { workspace = true }
ecm-bridge = { workspace = true }
ecm-router = { workspace = true }
ecm-bgp = { workspace = true }
# 802.11 station stack behind wlan0.
ecm-wifi = { path = "../../crates/ecm-wifi" }

# Netlink constants/structs shared with the WASI programs.
ecm-host-abi = { workspace = true }

[features]
default = []
