# Cellular v2: handover between cells on DIFFERENT channels. The phone only
# hears the other channel in measurement gaps (it tells its site, retunes
# for 160 ms, comes back), reports cell 2, and is handed over with a
# retune; the SSH session survives and the address stays the same.
#
#   site1 (cell 1, ch 1) at x=0            site2 (cell 2, ch 3) at x=1200
#        phone walks 100 -> 1100 (and back)
#   both sites, the core and the server share one LAN

[radio]
exponent = 3.5

[[node]]
name = "core"
ifaces = 1
[node.files]
"services.cfg" = "router on\n"
"router.cfg" = '''
configure terminal
ip routing
interface eth0
ip address 100.65.0.30/24
exit
end
'''
"cored.db" = '''
version 1
carrier cell-red
pool 100.65.2.0/24
gateway 100.65.2.1
site site-a 5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e
site site-b 6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f
sub 310150000000001 key=00112233445566778899aabbccddeeff
'''
[node.cell]
role = "core"

[[node]]
name = "site1"
ifaces = 1
[node.files]
"network.cfg" = "iface eth0 100.65.0.21/24\n"
[node.cell]
role = "site"
pos = [0, 0, 20]
site_id = "site-a"
secret = "5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e"
carrier = "cell-red"
cell_id = 1
channel = 1
core = "100.65.0.30"
neighbours = [{ cell = 2, channel = 3 }]

[[node]]
name = "site2"
ifaces = 1
[node.files]
"network.cfg" = "iface eth0 100.65.0.22/24\n"
[node.cell]
role = "site"
pos = [1200, 0, 20]
site_id = "site-b"
secret = "6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f"
carrier = "cell-red"
cell_id = 2
channel = 3
core = "100.65.0.30"
neighbours = [{ cell = 1, channel = 1 }]

[[node]]
name = "server"
ifaces = 1
[node.files]
"network.cfg" = '''
iface eth0 100.65.0.10/24
route 100.65.2.0/24 via 100.65.0.30 dev eth0
'''

[[node]]
name = "phone"
ifaces = 1
[node.cell]
role = "ue"
pos = [100, 0, 1.5]
carrier = "cell-red"
imsi = "310150000000001"
key = "00112233445566778899aabbccddeeff"
channels = [1, 3]

[[segment]]
name = "lan"
members = ["core:eth0", "site1:eth0", "site2:eth0", "server:eth0"]

[scenario]
name = "cell-handover-channels"
description = "inter-frequency handover with measurement gaps: SSH survives, IP unchanged"
steps = '''
expect_cell phone /attached cell 1 ip 100\.65\.2\.2\// within 10s
send server "sshd &"
expect server /sshd: starting on port 22/ within 5s
send phone "ssh root@100.65.0.10"
expect phone /ssh: connected/ within 30s
wait 1s
send phone "echo before-handover"
expect phone /^before-handover$/ within 10s
move phone 1100,0,1.5 over 15s
expect_cell site1 /cell 2 is .* dB stronger, handover/ within 20s
expect_cell phone /handover cell 1 -> 2 \(channel 3\)/ within 5s
expect_cell core /handover 310150000000001 cell 1 -> 2 \(ip 100\.65\.2\.2 kept\)/ within 5s
expect_cell site2 /arrived by handover/
wait 2s
send phone "echo after-handover"
expect phone /^after-handover$/ within 10s
send phone "exit"
expect phone /Connection closed\./ within 10s
wait_prompt phone within 10s
expect_cell_not phone /released|rejected|searching/ for 1s
send phone "ifconfig"
expect phone /100\.65\.2\.2/
wait_prompt phone
# back again with a ping running across the handover
move phone 100,0,1.5 over 15s
send phone "ping 100.65.0.10 -n 25"
expect phone /25 packets sent, 2[345] received/ within 40s
wait_prompt phone
expect_cell phone /handover cell 2 -> 1 \(channel 1\)/
expect_cell_not phone /released|rejected/ for 1s
cell status core
'''
