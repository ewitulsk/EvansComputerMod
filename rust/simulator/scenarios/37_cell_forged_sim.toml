# Cellular v2: a forged SIM (right IMSI, wrong key K). The core's challenge
# gets a wrong RES: attach rejected, no session, no address, and the phone
# does not retry. Control: a genuine SIM attaches next to it.

[radio]
exponent = 3.5

[[node]]
name = "core"
ifaces = 1
[node.files]
"services.cfg" = "router on\n"
"router.cfg" = '''
configure terminal
ip routing
interface eth0
ip address 100.65.0.30/24
exit
end
'''
"cored.db" = '''
version 1
carrier cell-red
pool 100.65.2.0/24
gateway 100.65.2.1
site site-a 5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e
site site-b 6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f
sub 310150000000001 key=00112233445566778899aabbccddeeff
sub 310150000000002 key=0123456789abcdef0123456789abcdef
'''
[node.cell]
role = "core"

[[node]]
name = "site1"
ifaces = 1
[node.files]
"network.cfg" = "iface eth0 100.65.0.21/24\n"
[node.cell]
role = "site"
pos = [0, 0, 20]
site_id = "site-a"
secret = "5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e"
carrier = "cell-red"
cell_id = 1
channel = 1
core = "100.65.0.30"

[[node]]
name = "site2"
ifaces = 1
[node.files]
"network.cfg" = "iface eth0 100.65.0.22/24\n"
[node.cell]
role = "site"
pos = [4000, 0, 20]
site_id = "site-b"
secret = "6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f"
carrier = "cell-red"
cell_id = 2
channel = 3
core = "100.65.0.30"

[[node]]
name = "server"
ifaces = 1
[node.files]
"network.cfg" = '''
iface eth0 100.65.0.10/24
route 100.65.2.0/24 via 100.65.0.30 dev eth0
'''

[[node]]
name = "forged"
ifaces = 1
[node.cell]
role = "ue"
pos = [120, 0, 1.5]
carrier = "cell-red"
imsi = "310150000000001"
key = "ffeeddccbbaa99887766554433221100"
channels = [1]

[[node]]
name = "genuine"
ifaces = 1
[node.cell]
role = "ue"
pos = [140, 0, 1.5]
carrier = "cell-red"
imsi = "310150000000002"
key = "0123456789abcdef0123456789abcdef"
channels = [1]

[[segment]]
name = "lan"
members = ["core:eth0", "site1:eth0", "site2:eth0", "server:eth0"]

[scenario]
name = "cell-forged-sim"
description = "a SIM with the wrong key is rejected by the core (RES mismatch) and gets no address"
steps = '''
expect_cell genuine /attached cell 1 ip 100\.65\.2\.\d+\// within 10s
expect_cell forged /rejected: authentication failed/ within 10s
expect_cell core /attach 310150000000001 rejected: authentication failed/ within 2s
expect_cell_not forged /attached/ for 10s
expect_cell_not core /attach 310150000000001 at/ for 1s
send forged "ping 100.65.0.10 -n 1"
expect forged /1 packets sent, 0 received/ within 10s
wait_prompt forged
send genuine "ping 100.65.0.10 -n 2"
expect genuine /2 packets sent, 2 received/ within 10s
'''
