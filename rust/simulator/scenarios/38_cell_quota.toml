# Cellular v2: a subscriber with a 1500-byte quota. The core counts every
# byte of the phone's traffic in both directions; when the quota is used up
# it releases the session (the phone is told why) and refuses new attaches
# until the operator changes the quota. Usage is saved in cored.db.

[radio]
exponent = 3.5

[[node]]
name = "core"
ifaces = 1
[node.files]
"services.cfg" = "router on\n"
"router.cfg" = '''
configure terminal
ip routing
interface eth0
ip address 100.65.0.30/24
exit
end
'''
"cored.db" = '''
version 1
carrier cell-red
pool 100.65.2.0/24
gateway 100.65.2.1
site site-a 5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e
site site-b 6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f
sub 310150000000001 key=00112233445566778899aabbccddeeff quota=1500
'''
[node.cell]
role = "core"

[[node]]
name = "site1"
ifaces = 1
[node.files]
"network.cfg" = "iface eth0 100.65.0.21/24\n"
[node.cell]
role = "site"
pos = [0, 0, 20]
site_id = "site-a"
secret = "5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e"
carrier = "cell-red"
cell_id = 1
channel = 1
core = "100.65.0.30"

[[node]]
name = "site2"
ifaces = 1
[node.files]
"network.cfg" = "iface eth0 100.65.0.22/24\n"
[node.cell]
role = "site"
pos = [4000, 0, 20]
site_id = "site-b"
secret = "6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f"
carrier = "cell-red"
cell_id = 2
channel = 3
core = "100.65.0.30"

[[node]]
name = "server"
ifaces = 1
[node.files]
"network.cfg" = '''
iface eth0 100.65.0.10/24
route 100.65.2.0/24 via 100.65.0.30 dev eth0
'''

[[node]]
name = "phone"
ifaces = 1
[node.cell]
role = "ue"
pos = [100, 0, 1.5]
carrier = "cell-red"
imsi = "310150000000001"
key = "00112233445566778899aabbccddeeff"
channels = [1]

[[segment]]
name = "lan"
members = ["core:eth0", "site1:eth0", "site2:eth0", "server:eth0"]

[scenario]
name = "cell-quota"
description = "quota exhaustion: release with the cause, attach refused, usage saved; the operator lifts the quota"
steps = '''
expect_cell phone /attached cell 1 ip 100\.65\.2\.2\// within 10s
send phone "ping 100.65.0.10 -n 20"
expect_cell core /310150000000001 quota exhausted \(\d+ of 1500 bytes\)/ within 40s
expect_cell phone /released: quota exhausted/ within 5s
expect phone /20 packets sent, ([0-9]|1[0-9]) received/ within 60s
wait_prompt phone
send core "cat cored.db"
expect core /quota=1500 used=1\d\d\d/ within 5s
wait_prompt core
cell admin phone "attach"
expect_cell phone /rejected: quota exhausted/ within 10s
expect_cell core /attach 310150000000001 rejected: quota exhausted/
cell admin core "quota 310150000000001 0"
expect_cell core /admin quota 310150000000001 0: 310150000000001 quota 0/ within 2s
cell admin phone "attach"
expect_cell phone /attached cell 1 ip 100\.65\.2\.2\// within 10s
send phone "ping 100.65.0.10 -n 3"
expect phone /3 packets sent, 3 received/ within 15s
'''
