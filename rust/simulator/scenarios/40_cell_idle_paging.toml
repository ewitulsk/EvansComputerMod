# Cellular v2: idle and paging. The site releases a quiet phone to idle
# (its session and address stay at the core). A packet for it makes the core
# page every site; the phone answers with a service request (authenticated
# with its session key), the session resumes and the packet is delivered.

[radio]
exponent = 3.5

[[node]]
name = "core"
ifaces = 1
[node.files]
"services.cfg" = "router on\n"
"router.cfg" = '''
configure terminal
ip routing
interface eth0
ip address 100.65.0.30/24
exit
end
'''
"cored.db" = '''
version 1
carrier cell-red
pool 100.65.2.0/24
gateway 100.65.2.1
site site-a 5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e
site site-b 6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f
sub 310150000000001 key=00112233445566778899aabbccddeeff
'''
[node.cell]
role = "core"

[[node]]
name = "site1"
ifaces = 1
[node.files]
"network.cfg" = "iface eth0 100.65.0.21/24\n"
[node.cell]
role = "site"
pos = [0, 0, 20]
site_id = "site-a"
secret = "5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e"
carrier = "cell-red"
cell_id = 1
channel = 1
core = "100.65.0.30"
idle_after = "3s"

[[node]]
name = "site2"
ifaces = 1
[node.files]
"network.cfg" = "iface eth0 100.65.0.22/24\n"
[node.cell]
role = "site"
pos = [4000, 0, 20]
site_id = "site-b"
secret = "6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f"
carrier = "cell-red"
cell_id = 2
channel = 3
core = "100.65.0.30"

[[node]]
name = "server"
ifaces = 1
[node.files]
"network.cfg" = '''
iface eth0 100.65.0.10/24
route 100.65.2.0/24 via 100.65.0.30 dev eth0
'''

[[node]]
name = "phone"
ifaces = 1
[node.cell]
role = "ue"
pos = [100, 0, 1.5]
carrier = "cell-red"
imsi = "310150000000001"
key = "00112233445566778899aabbccddeeff"
channels = [1]

[[segment]]
name = "lan"
members = ["core:eth0", "site1:eth0", "site2:eth0", "server:eth0"]

[scenario]
name = "cell-idle-paging"
description = "idle after inactivity, paging on downlink data, resume with the same address"
steps = '''
expect_cell phone /attached cell 1 ip 100\.65\.2\.2\// within 10s
expect_cell phone /released: inactivity/ within 10s
expect_cell phone /\] idle$/
expect_cell core /310150000000001 idle/
send server "ping 100.65.2.2 -n 3"
expect_cell phone /resumed cell 1/ within 5s
expect server /3 packets sent, [23] received/ within 15s
wait_prompt server
expect_cell phone /released: inactivity/ within 10s
send phone "ping 100.65.0.10 -n 2"
expect_cell phone /resumed cell 1/ within 5s
expect phone /2 packets sent, [12] received/ within 15s
'''
