# Cellular v2 (docs/gui/CELLULAR_V2.md): one carrier core, one cell site, one
# phone. The phone finds the cell, attaches with its SIM, gets 100.65.2.x from
# the core, and pings a server on the core's LAN; the server pings the phone.
#
#   phone ~~air~~ site1 --LAN 100.65.0.0/24-- core (cell0 100.65.2.1/24, routing)
#                                       \---- server 100.65.0.10

[radio]
exponent = 3.5

[[node]]
name = "core"
ifaces = 1
[node.files]
"services.cfg" = "router on\n"
"router.cfg" = '''
configure terminal
ip routing
interface eth0
ip address 100.65.0.30/24
exit
end
'''
"cored.db" = '''
version 1
carrier cell-red
pool 100.65.2.0/24
gateway 100.65.2.1
site site-a 5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e
sub 310150000000001 key=00112233445566778899aabbccddeeff
'''
[node.cell]
role = "core"
db = "cored.db"

[[node]]
name = "site1"
ifaces = 1
[node.files]
"network.cfg" = '''
iface eth0 100.65.0.21/24
'''
[node.cell]
role = "site"
pos = [0, 0, 20]
site_id = "site-a"
secret = "5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e"
carrier = "cell-red"
cell_id = 1
channel = 1
core = "100.65.0.30"

[[node]]
name = "server"
ifaces = 1
[node.files]
"network.cfg" = '''
iface eth0 100.65.0.10/24
route 100.65.2.0/24 via 100.65.0.30 dev eth0
'''

[[node]]
name = "phone"
ifaces = 1
[node.cell]
role = "ue"
pos = [150, 0, 1.5]
carrier = "cell-red"
imsi = "310150000000001"
key = "00112233445566778899aabbccddeeff"
channels = [1]

[[segment]]
name = "lan"
members = ["core:eth0", "site1:eth0", "server:eth0"]

[scenario]
name = "cell-attach"
description = "attach over the simulated framed PHY, phone address from the core, data both ways"
steps = '''
expect_cell site1 /registered with the core/ within 10s
expect_cell core /site site-a registered from 100\.65\.0\.21/ within 5s
expect_cell phone /attached cell 1 ip 100\.65\.2\.2\/24 gw 100\.65\.2\.1/ within 10s
expect_cell phone /wwan0 up 100\.65\.2\.2\/24 default via 100\.65\.2\.1$/ within 2s
expect_cell core /attach 310150000000001 at site-a cell 1: ip 100\.65\.2\.2/
send phone "ifconfig"
expect phone /wwan0/
wait_prompt phone
send phone "ping 100.65.0.10 -n 3"
expect phone /3 packets sent, 3 received/ within 15s
wait_prompt phone
send server "ping 100.65.2.2 -n 3"
expect server /3 packets sent, 3 received/ within 15s
wait_prompt server
cell status core
cell status site1
cell status phone
# control: an address outside the phone's network is not answered through the cell
send server "ping 100.65.2.77 -n 1"
expect server /1 packets sent, 0 received/ within 15s
'''
