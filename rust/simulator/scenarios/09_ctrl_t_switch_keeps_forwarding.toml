# Ctrl+T stops the foreground program on the switch box but the background
# switch service keeps forwarding; Ctrl+T on a host stops its ping.
[[node]]
name = "sw1"

[[node]]
name = "h1"
ifaces = 1
boot = ["ifconfig eth0 10.0.0.1/24"]

[[node]]
name = "h2"
ifaces = 1
boot = ["ifconfig eth0 10.0.0.2/24"]

[[link]]
a = "h1:eth0"
b = "sw1:eth0"

[[link]]
a = "h2:eth0"
b = "sw1:eth1"

[scenario]
name = "ctrl-t-switch-keeps-forwarding"
steps = '''
send sw1 "switch on"
expect sw1 /Switch started/
send sw1 "switch"
wait_prompt sw1
send sw1 "interface eth0"
send sw1 "no routing"
send sw1 "exit"
send sw1 "interface eth1"
send sw1 "no routing"
send sw1 "exit"
send sw1 "exit"
wait_prompt sw1
send h1 "ping 10.0.0.2 -n 20"
expect h1 /Reply from 10\.0\.0\.2/ within 5s
# A long-running foreground program on the switch box ...
send sw1 "sleep 60000"
wait 2s
expect_not sw1 /^\/ >/
# ... is stopped by Ctrl+T, which returns to the prompt ...
ctrl_t sw1
expect sw1 /\^T - Program terminated/ within 2s
wait_prompt sw1 within 2s
# ... while the switch keeps forwarding h1's pings.
expect h1 /20 packets sent, 20 received/ within 30s
send sw1 "ps"
expect_not sw1 /sleep/
# Ctrl+T on a host stops its ping mid-run.
send h1 "ping 10.0.0.2 -n 100"
expect h1 /Reply from/ within 5s
ctrl_t h1
expect h1 /\^T - Program terminated/ within 2s
wait_prompt h1 within 2s
expect_not h1 /100 packets sent/ for 3s
send h1 "ping 10.0.0.2 -n 1"
expect h1 /1 packets sent, 1 received/ within 10s
'''
