[[node]]
name = "r1"
ifaces = 5
[node.files]
"services.cfg" = "router on\n"
"router.cfg" = '''
configure terminal
ip routing
interface eth0
ip address 172.31.10.2/30
exit
interface eth1
ip address 172.31.1.1/30
exit
interface eth2
ip address 100.65.0.1/16
exit
router bgp 65001
bgp router-id 100.65.0.1
timers bgp 1 3
neighbor 172.31.10.1 remote-as 65010
neighbor 172.31.1.2 remote-as 65002
address-family ipv4 unicast
neighbor 172.31.10.1 activate
neighbor 172.31.1.2 activate
network 100.65.0.0/16
end
'''
