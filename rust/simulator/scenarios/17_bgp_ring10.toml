[scenario]
name = "bgp-ring10"
# Mirrors the Tech Village ISP routers (WorldNetwork.configs): eth0 village access LAN,
# eth1 server LAN, eth2/eth3 fiber to the previous/next village, 60/180 s timers. A fiber
# cut drops carrier, so the session falls over at once instead of waiting for hold time.
steps = '''
wait 15s
send r1 "router"
send r1 "show bgp ipv4 unicast summary"
expect r1 /Established/
send r1 "exit"
send client "ping 100.67.0.10 -n 2"
expect client /2 packets sent, 2 received/ within 10s
wait_prompt client
link down r1:eth3
wait 10s
send client "ping 100.67.0.10 -n 2"
expect client /2 packets sent, 2 received/ within 10s
wait_prompt client
link down r1:eth2
wait 5s
send client "ping 100.67.0.10 -n 1"
expect client /1 packets sent, 0 received/ within 10s
wait_prompt client
'''
