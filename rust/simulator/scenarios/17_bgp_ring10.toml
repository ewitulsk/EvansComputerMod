[[node]]
name = "server"
ifaces = 1
[node.files]
"network.cfg" = '''
iface eth0 100.67.0.10/24
route default via 100.67.0.1 dev eth0
'''
[[node]]
name = "client"
ifaces = 1
[node.files]
"network.cfg" = '''
iface eth0 100.65.0.10/24
route default via 100.65.0.1 dev eth0
'''
[[link]]
a = "r1:eth2"
b = "client:eth0"
[[link]]
a = "r1:eth1"
b = "r2:eth0"
[[link]]
a = "r2:eth1"
b = "r3:eth0"
[[link]]
