[[node]]
name = "r1"
ifaces = 5
[node.files]
"services.cfg" = "router on\n"
"router.cfg" = '''
configure terminal
ip routing
interface eth0
ip address 172.31.2.2/30
exit
interface eth1
ip address 172.31.1.1/30
exit
interface eth2
ip address 100.65.0.1/16
exit
router bgp 65001
bgp router-id 100.65.0.1
timers bgp 1 3
neighbor 172.31.2.1 remote-as 65002
neighbor 172.31.1.2 remote-as 65002
address-family ipv4 unicast
neighbor 172.31.2.1 activate
neighbor 172.31.1.2 activate
network 100.65.0.0/16
end
'''
[[node]]
name = "r2"
ifaces = 5
[node.files]
"services.cfg" = "router on\n"
"router.cfg" = '''
configure terminal
ip routing
interface eth0
ip address 172.31.1.2/30
exit
interface eth1
ip address 172.31.2.1/30
exit
interface eth2
ip address 100.66.0.1/16
exit
router bgp 65002
bgp router-id 100.66.0.1
timers bgp 1 3
neighbor 172.31.1.1 remote-as 65001
neighbor 172.31.2.2 remote-as 65001
address-family ipv4 unicast
neighbor 172.31.1.1 activate
neighbor 172.31.2.2 activate
network 100.66.0.0/16
end
'''
[[node]]
name = "server"
ifaces = 1
[node.files]
"network.cfg" = '''
iface eth0 100.66.0.10/24
route default via 100.66.0.1 dev eth0
'''
[[node]]
name = "client"
ifaces = 1
[node.files]
"network.cfg" = '''
iface eth0 100.65.0.10/24
route default via 100.65.0.1 dev eth0
'''
[[link]]
a = "r1:eth2"
b = "client:eth0"
[[link]]
a = "r1:eth1"
b = "r2:eth0"
[[link]]
a = "r2:eth1"
b = "r1:eth0"
[[link]]
a = "r2:eth2"
b = "server:eth0"
[scenario]
name = "bgp-ring2"
steps = '''
wait 15s
send r1 "router"
send r1 "show bgp ipv4 unicast summary"
expect r1 /Established/
send r1 "exit"
send client "ping 100.66.0.10 -n 2"
expect client /2 packets sent, 2 received/ within 10s
wait_prompt client
link down r1:eth1
wait 10s
send client "ping 100.66.0.10 -n 2"
expect client /2 packets sent, 2 received/ within 10s
wait_prompt client
link down r1:eth0
wait 5s
send client "ping 100.66.0.10 -n 1"
expect client /1 packets sent, 0 received/ within 10s
wait_prompt client
'''
