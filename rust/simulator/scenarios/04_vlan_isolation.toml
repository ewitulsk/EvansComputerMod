# Two VLANs on one switch. All hosts share one IP subnet, so the only thing
# stopping cross-VLAN traffic is the switch.
[[node]]
name = "sw1"

[[node]]
name = "a1"
ifaces = 1
boot = ["ifconfig eth0 10.0.0.1/24"]

[[node]]
name = "a2"
ifaces = 1
boot = ["ifconfig eth0 10.0.0.2/24"]

[[node]]
name = "b1"
ifaces = 1
boot = ["ifconfig eth0 10.0.0.3/24"]

[[node]]
name = "b2"
ifaces = 1
boot = ["ifconfig eth0 10.0.0.4/24"]

[[link]]
a = "a1:eth0"
b = "sw1:eth0"

[[link]]
a = "a2:eth0"
b = "sw1:eth1"

[[link]]
a = "b1:eth0"
b = "sw1:eth2"

[[link]]
a = "b2:eth0"
b = "sw1:eth3"

[scenario]
name = "vlan-isolation"
steps = '''
send sw1 "switch"
wait_prompt sw1
send sw1 "vlan 10"
send sw1 "no shutdown"
send sw1 "exit"
send sw1 "vlan 20"
send sw1 "no shutdown"
send sw1 "exit"
send sw1 "interface eth0"
send sw1 "no routing"
send sw1 "vlan access 10"
send sw1 "exit"
send sw1 "interface eth1"
send sw1 "no routing"
send sw1 "vlan access 10"
send sw1 "exit"
send sw1 "interface eth2"
send sw1 "no routing"
send sw1 "vlan access 20"
send sw1 "exit"
send sw1 "interface eth3"
send sw1 "no routing"
send sw1 "vlan access 20"
send sw1 "exit"
send sw1 "on"
send sw1 "show vlan"
expect sw1 /^10\s+\S+\s+up\s+ok\s+eth0,eth1/
expect sw1 /^20\s+\S+\s+up\s+ok\s+eth2,eth3/
# Leaving a detached CLI keeps the switch running.
send sw1 "exit"
wait_prompt sw1
# Same VLAN works.
send a1 "ping 10.0.0.2 -n 2"
expect a1 /2 packets sent, 2 received/ within 10s
send b1 "ping 10.0.0.4 -n 2"
expect b1 /2 packets sent, 2 received/ within 10s
# Cross-VLAN fails (ARP never crosses).
send a1 "ping 10.0.0.3 -n 2"
expect a1 /2 packets sent, 0 received/ within 20s
send b2 "ping 10.0.0.2 -n 2"
expect b2 /2 packets sent, 0 received/ within 20s
# Broadcasts from VLAN 10 never reach VLAN 20 ports.
send a2 "ping 10.0.0.99 -n 2"
assert_frames link=b1:eth0 max=0 during 3s
'''
