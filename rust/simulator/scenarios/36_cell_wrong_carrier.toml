# Cellular v2: a SIM of another carrier. The phone searches every channel,
# hears only cell-red cells and stays out of service (it never sends a
# random access to another carrier's cell). Control: a cell-red phone next
# to it attaches.

[radio]
exponent = 3.5

[[node]]
name = "core"
ifaces = 1
[node.files]
"services.cfg" = "router on\n"
"router.cfg" = '''
configure terminal
ip routing
interface eth0
ip address 100.65.0.30/24
exit
end
'''
"cored.db" = '''
version 1
carrier cell-red
pool 100.65.2.0/24
gateway 100.65.2.1
site site-a 5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e
site site-b 6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f
sub 310150000000001 key=00112233445566778899aabbccddeeff
'''
[node.cell]
role = "core"

[[node]]
name = "site1"
ifaces = 1
[node.files]
"network.cfg" = "iface eth0 100.65.0.21/24\n"
[node.cell]
role = "site"
pos = [0, 0, 20]
site_id = "site-a"
secret = "5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e"
carrier = "cell-red"
cell_id = 1
channel = 1
core = "100.65.0.30"

[[node]]
name = "site2"
ifaces = 1
[node.files]
"network.cfg" = "iface eth0 100.65.0.22/24\n"
[node.cell]
role = "site"
pos = [4000, 0, 20]
site_id = "site-b"
secret = "6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f"
carrier = "cell-red"
cell_id = 2
channel = 3
core = "100.65.0.30"

[[node]]
name = "server"
ifaces = 1
[node.files]
"network.cfg" = '''
iface eth0 100.65.0.10/24
route 100.65.2.0/24 via 100.65.0.30 dev eth0
'''

[[node]]
name = "blue"
ifaces = 1
[node.cell]
role = "ue"
pos = [120, 0, 1.5]
carrier = "cell-blue"
imsi = "310150000000001"
key = "00112233445566778899aabbccddeeff"
channels = [1, 3]

[[node]]
name = "red"
ifaces = 1
[node.cell]
role = "ue"
pos = [140, 0, 1.5]
carrier = "cell-red"
imsi = "310150000000001"
key = "00112233445566778899aabbccddeeff"
channels = [1, 3]

[[segment]]
name = "lan"
members = ["core:eth0", "site1:eth0", "site2:eth0", "server:eth0"]

[scenario]
name = "cell-wrong-carrier"
description = "a cell-blue SIM never uses cell-red cells; a cell-red SIM does"
steps = '''
expect_cell red /attached cell 1 ip 100\.65\.2\.2\// within 10s
expect_cell blue /no service \(heard cell-red\)/ within 10s
expect_cell_not blue /attached|attach/ for 5s
expect_cell_not core /rejected/ for 1s
send red "ping 100.65.0.10 -n 2"
expect red /2 packets sent, 2 received/ within 10s
'''
