[package]
name = "terminal-simulator"
version = "0.2.0"
edition = "2021"
description = "Headless/interactive host for terminal_os.wasm: ABI-exact kernel host, WASI children, cable topology, virtual clock and scenario runner"

[dependencies]
wasmtime = "29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"
harness = false
